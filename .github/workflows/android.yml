name: Build Android
on:
  push:
  workflow_dispatch:
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v2
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Setting up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setting up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accepting Google licenses and installing NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV
      - name: Restore existing build cache for faster compilation
        uses: actions/cache@v3
        with:
          key: cache-build-android-hmm
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-hmm
      - name: Installing hmm
        run: |
          haxelib install hmm --quiet
          haxelib run hmm setup
      - name: Installing pinned libraries
        run: |
          haxelib run hmm install
      - name: Installing extension-androidtools
        run: |
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
      - name: Setting up Lime for Android
        run: |
          haxelib run lime setup android -y
      - name: Building the game
        run: |
          haxelib run lime build android
      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v4
        with:
          name: Codename Engine
          path: export/release/android/bin
      - name: Clearing already existing cache
        uses: actions/github-script@v6
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key == "cache-build-android-hmm") {
                console.log('Clearing ' + cache.key + '...')
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
                console.log("Cache cleared.")
              }
            }
      - name: Uploading new cache
        uses: actions/cache@v3
        with:
          key: cache-build-android-hmm
          path: |
            .haxelib/
            export/release/android/haxe/
            export/release/android/obj/
          restore-keys: |
            cache-build-android-hmm
